<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian 多源剪藏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="38" height="38">
        <div>
          <h1>多源剪藏</h1>
          <p>视频字幕 · 讨论主题 → Markdown</p>
        </div>
      </div>
      <span id="platform-label" class="platform-mark">识别中</span>
    </header>

    <label class="choice-row video-only">
      <span>
        <strong>字幕</strong>
        <small>英文原声优先保留英文</small>
      </span>
      <select id="subtitle-mode" aria-label="字幕语言模式">
        <option value="smart">智能</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="bilingual">中英双语</option>
        <option value="follow-player">跟随播放器</option>
      </select>
    </label>

    <label class="choice-row video-only">
      <span>
        <strong>说话人</strong>
        <small>默认单人；按需提示 AI 分角色</small>
      </span>
      <select id="speaker-mode" aria-label="说话人模式">
        <option value="single">单人</option>
        <option value="two">双人</option>
        <option value="multi">多人</option>
      </select>
    </label>

    <label class="switch-row video-only">
      <span>
        <strong>自动选择字幕</strong>
        <small>静默选轨；必要时提示手动操作</small>
      </span>
      <input id="auto-enable-subtitles" type="checkbox" aria-label="自动选择播放器字幕">
      <i aria-hidden="true"></i>
    </label>

    <label class="switch-row video-only">
      <span>
        <strong>时间戳</strong>
        <small>回看或剪辑时开启</small>
      </span>
      <input id="include-timestamps" type="checkbox" aria-label="保留时间戳">
      <i aria-hidden="true"></i>
    </label>

    <label class="choice-row linuxdo-only" hidden>
      <span>
        <strong>讨论范围</strong>
        <small>完整读取，不要求滚动到底</small>
      </span>
      <select id="linuxdo-scope" aria-label="linux.do 帖子范围">
        <option value="all">全部楼层</option>
        <option value="author">主帖 + 楼主回复</option>
        <option value="main">只保存主帖</option>
      </select>
    </label>

    <button id="save" class="primary" type="button">静默存入 Obsidian</button>

    <div class="secondary-actions">
      <button id="copy" type="button">复制 Markdown</button>
      <button id="download" type="button">下载 .md</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <details id="preview-panel" class="utility-panel" hidden>
      <summary>查看 Markdown</summary>
      <textarea id="preview" readonly spellcheck="false" aria-label="Markdown 预览"></textarea>
    </details>

    <details class="utility-panel settings-panel">
      <summary>保存设置</summary>
      <div class="settings">
        <label>
          <span>Local REST API 地址</span>
          <input id="rest-api-url" type="text" spellcheck="false" autocomplete="off"
            placeholder="http://127.0.0.1:27123">
        </label>
        <label>
          <span>API Key（只保存在当前浏览器）</span>
          <input id="rest-api-key" type="password" spellcheck="false" autocomplete="off"
            placeholder="从 Obsidian Local REST API 设置复制">
        </label>
        <label class="video-only">
          <span>视频逐字稿目录</span>
          <input id="target-folder" type="text" spellcheck="false" autocomplete="off"
            placeholder="例如：Inbox/视频逐字稿">
        </label>
        <label class="linuxdo-only" hidden>
          <span>linux.do 帖子目录</span>
          <input id="linuxdo-target-folder" type="text" spellcheck="false" autocomplete="off"
            placeholder="例如：Inbox/LinuxDo">
        </label>
        <button id="test-connection" class="connection-test" type="button">测试后台连接</button>
        <p class="settings-help">需要 Obsidian 保持运行并启用 Local REST API。保存时不会打开笔记，也不会抢占当前窗口。</p>
      </div>
    </details>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
